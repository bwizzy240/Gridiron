<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gridiron — NFL Win Probability</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #12181D;
    --bg-row: #161D23;
    --line: #263038;
    --text: #EDEDE7;
    --text-dim: #8A9199;
    --home: #E3A857;
    --away: #5C89A6;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 32px 20px 64px;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 28px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--line);
  }

  header h1 {
    font-size: 22px;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.01em;
  }

  header .week {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    color: var(--text-dim);
  }

  .game {
    padding: 18px 0;
    border-bottom: 1px solid var(--line);
  }

  .game:last-child { border-bottom: none; }

  .matchup {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }

  .team {
    display: flex;
    align-items: baseline;
    gap: 8px;
    min-width: 0;
  }

  .team .abbr {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    color: var(--text-dim);
    width: 32px;
    flex-shrink: 0;
  }

  .team .name {
    font-size: 15px;
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .prob {
    font-family: 'Space Mono', monospace;
    font-size: 17px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
  }

  .game .home .prob { color: var(--home); }
  .game .away .prob { color: var(--away); }

  .bar {
    display: flex;
    height: 4px;
    border-radius: 2px;
    overflow: hidden;
    margin: 10px 0 6px;
    background: var(--line);
  }

  .bar .fill-home { background: var(--home); }
  .bar .fill-away { background: var(--away); }

  .meta {
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    display: flex;
    justify-content: space-between;
  }

  .loading, .empty {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    color: var(--text-dim);
    padding: 24px 0;
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Gridiron</h1>
    <span class="week" id="week-label">Loading…</span>
  </header>

  <div id="games">
    <div class="loading">Loading games…</div>
  </div>
</main>

<script type="module">
  // TODO: wire in the real model.
  // import { matchupProbability, projectPoints, spreadProbs, totalProbs } from './model.js';
  //
  // Expected shape per game, once real data replaces this stub:
  // {
  //   away: { abbr: 'BUF', name: 'Bills' },
  //   home: { abbr: 'KC',  name: 'Chiefs' },
  //   kickoff: '2026-09-07T17:00:00Z',
  //   homeWinProb: 0.64   // from matchupProbability(...)
  // }

  const STUB_GAMES = [
    { away: { abbr: 'BUF', name: 'Bills' }, home: { abbr: 'KC', name: 'Chiefs' },
      kickoff: '2026-09-07T17:00:00Z', homeWinProb: 0.64 },
    { away: { abbr: 'PHI', name: 'Eagles' }, home: { abbr: 'DAL', name: 'Cowboys' },
      kickoff: '2026-09-07T20:25:00Z', homeWinProb: 0.47 },
  ];

  function formatKickoff(iso) {
    const d = new Date(iso);
    return d.toLocaleString('en-US', {
      weekday: 'short', hour: 'numeric', minute: '2-digit', timeZoneName: 'short'
    });
  }

  function renderGame(g) {
    const homePct = Math.round(g.homeWinProb * 100);
    const awayPct = 100 - homePct;

    return `
      <div class="game">
        <div class="matchup">
          <div class="team away">
            <span class="abbr">${g.away.abbr}</span>
            <span class="name">${g.away.name}</span>
          </div>
          <span class="prob">${awayPct}%</span>
        </div>
        <div class="bar">
          <div class="fill-away" style="width:${awayPct}%"></div>
          <div class="fill-home" style="width:${homePct}%"></div>
        </div>
        <div class="matchup">
          <div class="team home">
            <span class="abbr">${g.home.abbr}</span>
            <span class="name">${g.home.name}</span>
          </div>
          <span class="prob">${homePct}%</span>
        </div>
        <div class="meta">
          <span>${formatKickoff(g.kickoff)}</span>
        </div>
      </div>
    `;
  }

  function render(games) {
    const container = document.getElementById('games');
    if (!games.length) {
      container.innerHTML = '<div class="empty">No games scheduled.</div>';
      return;
    }
    container.innerHTML = games.map(renderGame).join('');
  }

  document.getElementById('week-label').textContent = 'Week 1 · 2026';
  render(STUB_GAMES);
</script>
</body>
</html>
